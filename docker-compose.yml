services:
  app:
    build: .
    ports:
      - "${APP_PORT:-8000}:80"
    environment:
      APP_NAME: "Challenge GIPHY API"
      APP_ENV: production
      APP_DEBUG: "false"
      APP_URL: "http://localhost:${APP_PORT:-8000}"
      APP_KEY: "${APP_KEY:-}"
      LOG_CHANNEL: stderr
      AUDIT_LOG_STDOUT: "${AUDIT_LOG_STDOUT:-true}"
      DB_CONNECTION: mariadb
      DB_HOST: db
      DB_PORT: 3306
      DB_DATABASE: giphy_api
      DB_USERNAME: giphy
      DB_PASSWORD: secret
      SESSION_DRIVER: array
      CACHE_STORE: file
      QUEUE_CONNECTION: sync
      GIPHY_API_KEY: "${GIPHY_API_KEY:-}"
      SEED_DEMO_USER: "${SEED_DEMO_USER:-true}"
    volumes:
      - app_storage:/var/www/html/storage
    depends_on:
      db:
        condition: service_healthy

  db:
    image: mariadb:11
    environment:
      MARIADB_DATABASE: giphy_api
      MARIADB_USER: giphy
      MARIADB_PASSWORD: secret
      MARIADB_ROOT_PASSWORD: root-secret
    volumes:
      - db_data:/var/lib/mysql
    ports:
      - "127.0.0.1:${DB_FORWARD_PORT:-3307}:3306"
    healthcheck:
      test: ["CMD", "healthcheck.sh", "--connect", "--innodb_initialized"]
      interval: 5s
      timeout: 5s
      retries: 20

volumes:
  db_data:
  app_storage:
